{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Djinn - Monolith</title>
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js" integrity="sha384-he4LfN7FT3F3xdBl3HTyZjbIgG7cARYaVx1KU3+s3pUJ2PB/Bb2QTlnqyLnHlKE6" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
    <style> body { background-color: #0f172a; color: white; font-family: sans-serif; } [x-cloak] { display: none !important; } </style>
</head>
<body>
    <nav class="h-16 border-b border-white/5 flex items-center justify-between px-6 lg:px-12">
        <a href="/" class="text-xl font-black uppercase tracking-tighter">Djinn</a>
        <div class="flex gap-8">
            <a href="/registry/" class="text-xs font-black uppercase tracking-widest text-slate-400 hover:text-white">Registry</a>
            <a href="/workbench/" class="text-xs font-black uppercase tracking-widest text-slate-400 hover:text-white">Workbench</a>
        </div>
    </nav>
    <main>{% block content %}{% endblock %}</main>
</body>
</html>
