<section class="py-24 px-6 lg:px-12 max-w-6xl mx-auto text-center flex flex-col items-center">
    <div class="px-3 py-1 bg-blue-600/10 border border-blue-600/30 rounded-full text-[10px] font-black uppercase tracking-[0.2em] text-blue-400 mb-8">{{ badge }}</div>
    <h1 class="text-6xl md:text-8xl font-black tracking-tighter mb-8 leading-[0.9]">{{ title_line1 }}<br /><span class="text-blue-600">{{ title_line2 }}</span></h1>
    <p class="text-lg md:text-xl text-slate-400 max-w-2xl mb-12 font-medium">{{ description }}</p>
    {% slot "terminal" %}{% endslot %}
</section>
