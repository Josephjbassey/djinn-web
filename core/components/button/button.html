<button
  type="{{ type|default:'button' }}"
  class="inline-flex items-center justify-center rounded-[var(--radius,0.5rem)] text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 disabled:opacity-50 disabled:pointer-events-none active:scale-95
  {% if variant == 'primary' %} bg-blue-600 text-white hover:bg-blue-500 shadow-[0_0_20px_-5px_rgba(59,130,246,0.5)]
  {% elif variant == 'secondary' %} bg-slate-800 text-slate-100 hover:bg-slate-700
  {% elif variant == 'ghost' %} hover:bg-white/10 hover:text-white
  {% elif variant == 'destructive' %} bg-red-500 text-white hover:bg-red-600
  {% elif variant == 'outline' %} border border-white/10 bg-transparent hover:bg-white/5 hover:text-white
  {% else %} bg-blue-600 text-white hover:bg-blue-500
  {% endif %}
  {% if size == 'sm' %} h-8 px-3 text-xs
  {% elif size == 'md' %} h-10 py-2.5 px-6
  {% elif size == 'lg' %} h-12 px-10 text-base
  {% else %} h-10 py-2.5 px-6
  {% endif %}
  {{ class }}"
  {% if disabled %}disabled{% endif %}
  {{ extra_attrs|safe }}
>
  {% slot "default" %}{{ slot }}{% endslot %}
</button>
